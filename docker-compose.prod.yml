version: '3.8'

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: elk-zone-frontend
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=https://api.elk.zone
      - NEXT_PUBLIC_WS_URL=wss://api.elk.zone
      - NEXT_PUBLIC_APP_URL=https://elk.zone
    ports:
      - "3000:3000"
    restart: unless-stopped
    networks:
      - elk-zone-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: elk-zone-backend
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - JWT_SECRET=${JWT_SECRET}
      - MATRIX_URL=${MATRIX_URL}
      - PEERTUBE_URL=${PEERTUBE_URL}
      - JITSI_URL=${JITSI_URL}
      - ACTIVITYPUB_DOMAIN=${ACTIVITYPUB_DOMAIN}
      - ACTIVITYPUB_PRIVATE_KEY=${ACTIVITYPUB_PRIVATE_KEY}
      - ACTIVITYPUB_PUBLIC_KEY=${ACTIVITYPUB_PUBLIC_KEY}
    ports:
      - "4000:4000"
    depends_on:
      - postgres
      - redis
    restart: unless-stopped
    networks:
      - elk-zone-network
    volumes:
      - ./uploads:/app/uploads

  postgres:
    image: postgres:15-alpine
    container_name: elk-zone-postgres
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8 --lc-collate=C --lc-ctype=C
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    ports:
      - "5432:5432"
    restart: unless-stopped
    networks:
      - elk-zone-network

  redis:
    image: redis:7-alpine
    container_name: elk-zone-redis
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    restart: unless-stopped
    networks:
      - elk-zone-network

  nginx:
    image: nginx:alpine
    container_name: elk-zone-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/ssl:/etc/nginx/ssl
      - ./uploads:/var/www/uploads
    depends_on:
      - frontend
      - backend
    restart: unless-stopped
    networks:
      - elk-zone-network

  # Monitoring Stack
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.5.0
    container_name: elk-zone-elasticsearch
    environment:
      - discovery.type=single-node
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - xpack.security.enabled=false
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    restart: unless-stopped
    networks:
      - elk-zone-network

  logstash:
    image: docker.elastic.co/logstash/logstash:8.5.0
    container_name: elk-zone-logstash
    volumes:
      - ./logstash/pipeline:/usr/share/logstash/pipeline
      - ./logs:/logs
    ports:
      - "5044:5044"
    depends_on:
      - elasticsearch
    restart: unless-stopped
    networks:
      - elk-zone-network

  kibana:
    image: docker.elastic.co/kibana/kibana:8.5.0
    container_name: elk-zone-kibana
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    depends_on:
      - elasticsearch
    restart: unless-stopped
    networks:
      - elk-zone-network

  # Prometheus for metrics
  prometheus:
    image: prom/prometheus:latest
    container_name: elk-zone-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
    restart: unless-stopped
    networks:
      - elk-zone-network

  # Grafana for dashboards
  grafana:
    image: grafana/grafana:latest
    container_name: elk-zone-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - elk-zone-network

volumes:
  postgres_data:
  redis_data:
  elasticsearch_data:
  prometheus_data:
  grafana_data:

networks:
  elk-zone-network:
    driver: bridge