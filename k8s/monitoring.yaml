# ServiceMonitor for Prometheus
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: elkzone-backend-metrics
  namespace: elkzone-prod
  labels:
    app: elkzone-backend
    release: prometheus
spec:
  selector:
    matchLabels:
      app: elkzone-backend
  endpoints:
  - port: http
    path: /api/metrics
    interval: 30s
    scrapeTimeout: 10s
---
# PrometheusRule for alerting
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: elkzone-alerts
  namespace: elkzone-prod
  labels:
    app: elkzone
    release: prometheus
spec:
  groups:
  - name: elkzone.rules
    rules:
    - alert: ElkZoneBackendDown
      expr: up{job="elkzone-backend"} == 0
      for: 5m
      labels:
        severity: critical
      annotations:
        summary: "ELK.Zone backend is down"
        description: "ELK.Zone backend has been down for more than 5 minutes"
    
    - alert: ElkZoneFrontendDown
      expr: up{job="elkzone-frontend"} == 0
      for: 5m
      labels:
        severity: critical
      annotations:
        summary: "ELK.Zone frontend is down"
        description: "ELK.Zone frontend has been down for more than 5 minutes"
    
    - alert: HighCPUUsage
      expr: rate(container_cpu_usage_seconds_total{pod=~"elkzone-.*"}[5m]) * 100 > 80
      for: 10m
      labels:
        severity: warning
      annotations:
        summary: "High CPU usage detected"
        description: "CPU usage is above 80% for more than 10 minutes"
    
    - alert: HighMemoryUsage
      expr: container_memory_usage_bytes{pod=~"elkzone-.*"} / container_spec_memory_limit_bytes * 100 > 90
      for: 10m
      labels:
        severity: warning
      annotations:
        summary: "High memory usage detected"
        description: "Memory usage is above 90% for more than 10 minutes"
    
    - alert: PodRestartHigh
      expr: rate(kube_pod_container_status_restarts_total{pod=~"elkzone-.*"}[15m]) > 0
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "Pod restarting frequently"
        description: "Pod {{ $labels.pod }} is restarting frequently"