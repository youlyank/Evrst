apiVersion: v1
kind: ConfigMap
metadata:
  name: elkzone-config
  namespace: elkzone-prod
data:
  NODE_ENV: "production"
  NEXT_PUBLIC_API_URL: "https://elk.zone/api"
  NEXT_PUBLIC_WS_URL: "wss://elk.zone"
  NEXT_PUBLIC_APP_URL: "https://elk.zone"
  MATRIX_URL: "https://matrix.elk.zone"
  PEERTUBE_URL: "https://videos.elk.zone"
  JITSI_URL: "https://meet.elk.zone"
  ACTIVITYPUB_DOMAIN: "elk.zone"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: elkzone-config
  namespace: elkzone-staging
data:
  NODE_ENV: "staging"
  NEXT_PUBLIC_API_URL: "https://staging.elk.zone/api"
  NEXT_PUBLIC_WS_URL: "wss://staging.elk.zone"
  NEXT_PUBLIC_APP_URL: "https://staging.elk.zone"
  MATRIX_URL: "https://matrix.staging.elk.zone"
  PEERTUBE_URL: "https://videos.staging.elk.zone"
  JITSI_URL: "https://meet.staging.elk.zone"
  ACTIVITYPUB_DOMAIN: "staging.elk.zone"