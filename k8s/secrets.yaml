apiVersion: v1
kind: Secret
metadata:
  name: elkzone-secrets
  namespace: elkzone-prod
type: Opaque
data:
  # IMPORTANT: Replace these with your actual base64-encoded secrets
  # Generate with: echo -n "your-secret" | base64
  DATABASE_URL: <BASE64_ENCODED_DATABASE_URL>
  REDIS_URL: <BASE64_ENCODED_REDIS_URL>
  JWT_SECRET: <BASE64_ENCODED_JWT_SECRET_32_PLUS_CHARS>
  ACTIVITYPUB_PRIVATE_KEY: <BASE64_ENCODED_ACTIVITYPUB_PRIVATE_KEY>
  ACTIVITYPUB_PUBLIC_KEY: <BASE64_ENCODED_ACTIVITYPUB_PUBLIC_KEY>
  GRAFANA_PASSWORD: <BASE64_ENCODED_GRAFANA_PASSWORD>
---
apiVersion: v1
kind: Secret
metadata:
  name: elkzone-secrets
  namespace: elkzone-staging
type: Opaque
data:
  # IMPORTANT: Replace these with your actual base64-encoded secrets for staging
  DATABASE_URL: <BASE64_ENCODED_STAGING_DATABASE_URL>
  REDIS_URL: <BASE64_ENCODED_STAGING_REDIS_URL>
  JWT_SECRET: <BASE64_ENCODED_STAGING_JWT_SECRET_32_PLUS_CHARS>
  ACTIVITYPUB_PRIVATE_KEY: <BASE64_ENCODED_STAGING_ACTIVITYPUB_PRIVATE_KEY>
  ACTIVITYPUB_PUBLIC_KEY: <BASE64_ENCODED_STAGING_ACTIVITYPUB_PUBLIC_KEY>
  GRAFANA_PASSWORD: <BASE64_ENCODED_STAGING_GRAFANA_PASSWORD>