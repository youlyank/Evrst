name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: elkzone

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linting
        run: npm run lint

      - name: Run type checking
        run: npm run type-check

      - name: Build application
        run: npm run build

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/backend
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.backend
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract metadata for frontend
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/frontend
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.frontend
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop'
    environment: staging

    steps:
      - uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'

      - name: Configure kubectl
        run: |
          echo "${{ secrets.KUBE_CONFIG_STAGING }}" | base64 -d > kubeconfig
          export KUBECONFIG=$PWD/kubeconfig

      - name: Deploy to staging
        run: |
          export KUBECONFIG=$PWD/kubeconfig
          kubectl set image deployment/elkzone-backend backend=${{ env.REGISTRY }}/${{ github.repository }}/backend:${{ github.sha }} -n elkzone-staging
          kubectl set image deployment/elkzone-frontend frontend=${{ env.REGISTRY }}/${{ github.repository }}/frontend:${{ github.sha }} -n elkzone-staging
          kubectl rollout status deployment/elkzone-backend -n elkzone-staging
          kubectl rollout status deployment/elkzone-frontend -n elkzone-staging

  deploy-production:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'

      - name: Configure kubectl
        run: |
          echo "${{ secrets.KUBE_CONFIG_PRODUCTION }}" | base64 -d > kubeconfig
          export KUBECONFIG=$PWD/kubeconfig

      - name: Deploy to production
        run: |
          export KUBECONFIG=$PWD/kubeconfig
          
          # Update image tags
          kubectl set image deployment/elkzone-backend backend=${{ env.REGISTRY }}/${{ github.repository }}/backend:${{ github.sha }} -n elkzone-prod
          kubectl set image deployment/elkzone-frontend frontend=${{ env.REGISTRY }}/${{ github.repository }}/frontend:${{ github.sha }} -n elkzone-prod
          
          # Wait for rollout
          kubectl rollout status deployment/elkzone-backend -n elkzone-prod --timeout=600s
          kubectl rollout status deployment/elkzone-frontend -n elkzone-prod --timeout=600s
          
          # Run health checks
          kubectl wait --for=condition=ready pod -l app=elkzone-backend -n elkzone-prod --timeout=300s
          kubectl wait --for=condition=ready pod -l app=elkzone-frontend -n elkzone-prod --timeout=300s

      - name: Run smoke tests
        run: |
          export KUBECONFIG=$PWD/kubeconfig
          
          # Port-forward to test endpoints
          kubectl port-forward svc/elkzone-backend 4000:4000 -n elkzone-prod &
          PF_PID=$!
          sleep 10
          
          # Test health endpoint
          curl -f http://localhost:4000/api/health || exit 1
          
          # Cleanup
          kill $PF_PID

      - name: Notify deployment success
        if: success()
        run: |
          echo "🎉 Deployment to production successful!"
          echo "Image tag: ${{ github.sha }}"
          echo "Namespace: elkzone-prod"

      - name: Notify deployment failure
        if: failure()
        run: |
          echo "❌ Deployment to production failed!"
          echo "Please check the logs and rollback if necessary"