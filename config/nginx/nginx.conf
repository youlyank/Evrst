events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    
    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=login:10m rate=1r/s;

    # Upstream servers
    upstream elkzone {
        server elkzone:3000;
    }

    upstream akkoma {
        server akkoma:4000;
    }

    upstream matrix {
        server synapse:8008;
    }

    upstream peertube {
        server peertube:9000;
    }

    upstream jitsi {
        server jitsi:8080;
    }

    upstream grafana {
        server grafana:3000;
    }

    upstream socket_server {
        server socket-server:3001;
    }

    # Main ELK.Zone domain
    server {
        listen 80;
        server_name elkzone.com www.elkzone.com;

        # Redirect to HTTPS
        return 301 https://$server_name$request_uri;
    }

    server {
        listen 443 ssl http2;
        server_name elkzone.com www.elkzone.com;

        # SSL configuration
        ssl_certificate /etc/nginx/ssl/elkzone.crt;
        ssl_certificate_key /etc/nginx/ssl/elkzone.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        # Security headers
        add_header X-Frame-Options DENY;
        add_header X-Content-Type-Options nosniff;
        add_header X-XSS-Protection "1; mode=block";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # Main application
        location / {
            proxy_pass http://elkzone;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }

        # API endpoints with rate limiting
        location /api/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://elkzone;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Socket.IO endpoint
        location /socket.io/ {
            proxy_pass http://socket_server;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Static files
        location /_next/static/ {
            proxy_pass http://elkzone;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
    }

    # Social subdomain (Akkoma)
    server {
        listen 80;
        server_name social.elkzone.com;

        return 301 https://$server_name$request_uri;
    }

    server {
        listen 443 ssl http2;
        server_name social.elkzone.com;

        ssl_certificate /etc/nginx/ssl/elkzone.crt;
        ssl_certificate_key /etc/nginx/ssl/elkzone.key;

        location / {
            proxy_pass http://akkoma;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }
    }

    # Chat subdomain (Matrix)
    server {
        listen 80;
        server_name chat.elkzone.com;

        return 301 https://$server_name$request_uri;
    }

    server {
        listen 443 ssl http2;
        server_name chat.elkzone.com;

        ssl_certificate /etc/nginx/ssl/elkzone.crt;
        ssl_certificate_key /etc/nginx/ssl/elkzone.key;

        location / {
            proxy_pass http://matrix;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # Video subdomain (PeerTube)
    server {
        listen 80;
        server_name video.elkzone.com;

        return 301 https://$server_name$request_uri;
    }

    server {
        listen 443 ssl http2;
        server_name video.elkzone.com;

        ssl_certificate /etc/nginx/ssl/elkzone.crt;
        ssl_certificate_key /etc/nginx/ssl/elkzone.key;

        location / {
            proxy_pass http://peertube;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Handle large file uploads
        client_max_body_size 100M;
    }

    # Calls subdomain (Jitsi)
    server {
        listen 80;
        server_name meet.elkzone.com;

        return 301 https://$server_name$request_uri;
    }

    server {
        listen 443 ssl http2;
        server_name meet.elkzone.com;

        ssl_certificate /etc/nginx/ssl/elkzone.crt;
        ssl_certificate_key /etc/nginx/ssl/elkzone.key;

        location / {
            proxy_pass http://jitsi;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # Monitoring subdomain (Grafana)
    server {
        listen 80;
        server_name monitor.elkzone.com;

        return 301 https://$server_name$request_uri;
    }

    server {
        listen 443 ssl http2;
        server_name monitor.elkzone.com;

        ssl_certificate /etc/nginx/ssl/elkzone.crt;
        ssl_certificate_key /etc/nginx/ssl/elkzone.key;

        location / {
            proxy_pass http://grafana;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}